alerts:
  - name: high_latency_p95
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: low_quality_score
    severity: warning
    condition: mean_quality_score < 0.75
    duration: 10m
    type: symptom-based
    channel: slack
    owner: model-evaluation-team
    runbook: docs/alerts.md#alert-3
